<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}다온 클래스{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{% url 'products:list' %}" class="text-xl font-bold text-indigo-600">다온 클래스</a>
            <div class="flex gap-4 items-center text-sm">
                {% if user.is_authenticated %}
                    <a href="{% url 'orders:my_courses' %}" class="text-gray-600 hover:text-indigo-600 font-medium">내 강의</a>
                    <a href="{% url 'orders:my_orders' %}" class="text-gray-600 hover:text-indigo-600">주문내역</a>
                    <a href="{% url 'accounts:mypage' %}" class="text-gray-600 hover:text-indigo-600">마이페이지</a>
                    <a href="{% url 'accounts:logout' %}" class="text-gray-500 hover:text-indigo-600">로그아웃</a>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="text-gray-600 hover:text-indigo-600">로그인</a>
                    <a href="{% url 'accounts:signup' %}" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg hover:bg-indigo-700">회원가입</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% elif message.tags == 'success' %}bg-green-100 text-green-700{% else %}bg-blue-100 text-blue-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="border-t mt-12 py-6 text-center text-gray-500 text-sm">
        © 2026 다온 클래스. All rights reserved.
    </footer>
</body>
</html>
